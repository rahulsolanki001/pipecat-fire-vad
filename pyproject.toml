[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-firered-vad"
version = "0.1.0"
description = "FireRedVAD integration for Pipecat — SOTA streaming Voice Activity Detection supporting 100+ languages"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Your Name", email = "you@example.com" }
]
keywords = [
  "pipecat",
  "vad",
  "voice-activity-detection",
  "fireredvad",
  "speech",
  "audio",
  "streaming",
  "real-time",
  "conversational-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"

dependencies = [
  "pipecat-ai>=0.0.90",
  "numpy>=1.24.0",
  "loguru>=0.6.0",
  # fireredvad reached PyPI as 0.0.2, so the manual GitHub checkout is no
  # longer needed. The [cpu] extra is not optional in practice: fireredvad
  # declares torch only under its gpu/cpu extras, but fireredvad/aed.py
  # imports torch unconditionally, so a bare `fireredvad` cannot be imported
  # at all. Swap to fireredvad[gpu] if you want the CUDA build.
  "fireredvad[cpu]>=0.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4.0",
]

[project.urls]
Homepage       = "https://github.com/rahulsolanki001/pipecat-fire-vad"
Repository     = "https://github.com/rahulsolanki001/pipecat-fire-vad"
"Bug Tracker"  = "https://github.com/rahulsolanki001/pipecat-fire-vad/issues"
Changelog      = "https://github.com/rahulsolanki001/pipecat-fire-vad/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_firered_vad"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]